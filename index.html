<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer | Marmoset Showcase</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #00f2ff;
            --error-color: #ff4444;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        #viewer-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--accent-color);
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 250px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            transition: width 0.1s ease;
            box-shadow: 0 0 10px var(--accent-color);
        }

        #error-message {
            display: none;
            color: var(--error-color);
            margin-top: 20px;
            text-align: center;
            max-width: 80%;
            font-size: 0.9rem;
            line-height: 1.5;
            background: rgba(255, 68, 68, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 68, 68, 0.2);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            opacity: 0.4;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <span class="loader" id="loader-icon"></span>
        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <p id="loading-text">Initializing Engine...</p>
        <div id="error-message"></div>
    </div>

    <div id="ui-overlay">
        <div class="glass-panel">
            <h1>3D Showcase</h1>
            <p id="model-name">Loading model...</p>
        </div>
    </div>

    <div id="viewer-container"></div>

    <div class="controls-hint">
        Left Click: Rotate | Right Click: Pan | Scroll: Zoom
    </div>

    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

        const container = document.getElementById("viewer-container");
        const loadingScreen = document.getElementById("loading-screen");
        const progressFill = document.getElementById("progress-fill");
        const loadingText = document.getElementById("loading-text");
        const errorMessage = document.getElementById("error-message");
        const loaderIcon = document.getElementById("loader-icon");

        function showError(msg) {
            errorMessage.innerText = msg;
            errorMessage.style.display = "block";
            loaderIcon.style.display = "none";
            loadingText.innerText = "Failed to load model";
        }

        // Check protocol
        if (window.location.protocol === 'file:') {
            showError("セキュリティ制限(CORS)により、ファイルを直接開くとモデルが読み込めません。'npx serve' 等のローカルサーバーを使用して開いてください。");
        }

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        // Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 5, 15);

        // Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // Model Loader
        const loader = new GLTFLoader();
        const modelPath = "3dmarmoset_simplified.glb";

        loader.load(
            modelPath,
            (gltf) => {
                const model = gltf.scene;
                
                // Centering and Scaling
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);
                
                scene.add(model);
                
                // Adjust camera
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.z = maxDim * 2.5;
                camera.updateProjectionMatrix();
                
                document.getElementById("model-name").innerText = "3dmarmoset_simplified.glb";

                // Fade out loading screen
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 800);
                }, 500);
            },
            (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = (xhr.loaded / xhr.total) * 100;
                    progressFill.style.width = percent + '%';
                    loadingText.innerText = `Loading Assets: ${Math.round(percent)}% (${(xhr.loaded / 1048576).toFixed(1)}MB)`;
                } else {
                    // Fallback if size unknown
                    loadingText.innerText = `Loading Assets: ${(xhr.loaded / 1048576).toFixed(1)}MB loaded...`;
                }
            },
            (error) => {
                console.error("Load Error:", error);
                showError("モデルの読み込み中にエラーが発生しました。ファイル名が正しいか、サーバーが正常か確認してください。\nError: " + error.message);
            }
        );

        // Resize handler
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
