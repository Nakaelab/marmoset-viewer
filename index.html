<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer | Marmoset Showcase</title>
    <meta name="description" content="マーモセットの3Dモデルビューアー。回転・ズーム操作に対応。">

    <!-- model-viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #00f2ff;
            --text-color: #ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        model-viewer {
            width: 100%;
            height: 100vh;
            background: transparent;
            --progress-bar-color: var(--accent-color);
            --progress-mask: transparent;
        }

        /* カスタムローディングオーバーレイ */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--accent-color);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes rotation {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 280px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            transition: width 0.2s ease;
            box-shadow: 0 0 8px var(--accent-color);
        }

        #status-text {
            font-size: 0.9rem;
            margin: 10px 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- ローディング画面 -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="status-text">Loading 3D Model...</div>
    </div>

    <!-- model-viewer 本体 -->
    <model-viewer
        id="marmoset-viewer"
        src="3dsimp_comp (1).glb"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="30deg"
        shadow-intensity="1"
        exposure="1"
        style="width: 100%; height: 100vh; background: transparent;">
    </model-viewer>

    <script>
        const viewer       = document.getElementById('marmoset-viewer');
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill  = document.getElementById('progress-fill');
        const statusText    = document.getElementById('status-text');

        // 読み込み進捗
        viewer.addEventListener('progress', (e) => {
            const pct = Math.round(e.detail.totalProgress * 100);
            progressFill.style.width = pct + '%';
            statusText.innerText = `Downloading: ${pct}%`;
        });

        // 読み込み完了
        viewer.addEventListener('load', () => {
            statusText.innerText = 'Complete!';
            progressFill.style.width = '100%';
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 400);
        });

        // エラー
        viewer.addEventListener('error', (e) => {
            statusText.innerText = 'Error: ' + (e.detail?.type || 'Failed to load model');
            statusText.style.color = '#ff4444';
        });
    </script>

</body>
</html>
