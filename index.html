<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer | Marmoset Showcase</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #00f2ff;
            --error-color: #ff4444;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--accent-color);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            transition: width 0.2s ease;
        }

        #status-text {
            font-size: 0.9rem;
            margin: 10px 0;
            color: var(--text-color);
            opacity: 0.8;
        }

        #error-log {
            display: none;
            color: var(--error-color);
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            max-width: 80%;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
        }

        #viewer-container { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader" id="loader-icon"></div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="status-text">Loading Assets...</div>
        <div id="error-log"></div>
    </div>

    <div id="viewer-container"></div>

    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const errorLog = document.getElementById('error-log');

        function logError(msg) {
            errorLog.style.display = 'block';
            errorLog.innerText += `\n> ${msg}`;
            statusText.innerText = "Error Detected";
        }

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('viewer-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const loader = new GLTFLoader();
        const modelFile = "3dmarmoset_simplified.glb";

        loader.load(
            modelFile,
            (gltf) => {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);
                scene.add(model);

                const size = box.getSize(new THREE.Vector3());
                camera.position.z = Math.max(size.x, size.y, size.z) * 2.5;
                
                document.getElementById('loading-screen').style.display = 'none';
            },
            (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    progressFill.style.width = percent + '%';
                    statusText.innerText = `Downloading Model: ${percent}% (${(xhr.loaded / 1048576).toFixed(1)}MB / ${(xhr.total / 1048576).toFixed(1)}MB)`;
                } else {
                    statusText.innerText = `Downloading: ${(xhr.loaded / 1048576).toFixed(1)}MB loaded...`;
                }
            },
            (error) => {
                console.error(error);
                logError("Failed to load model file. Make sure the file exists in the same folder.");
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
